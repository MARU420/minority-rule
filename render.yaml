# Render.com blueprint: API server + static client, both free tier.
# Assumes service names below (URLs are deterministic).
services:
  - type: web
    name: minority-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://minority-client.onrender.com
      - key: DATABASE_PATH
        # NOTE: ephemeral on free tier (wiped on restart).
        # Attach a paid disk at /data for persistence, or use Oracle VPS.
        value: /tmp/minority.db

  - type: web
    name: minority-client
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://minority-server.onrender.com
